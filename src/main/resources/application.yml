spring:
  application:
    name: ecommerce-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  cache:
    type: ${CACHE_TYPE:simple}
    cache-names: products,product-details,categories,category-tree,brands,active-brands,search-autocomplete,search-trending,dashboard-summary
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    groups-order: ASC
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-secure-jwt-secret-0123456789}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: ecommerce-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:ecommerce}
  verification:
    otp-length: ${OTP_LENGTH:6}
    otp-ttl-minutes: ${OTP_TTL_MINUTES:10}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    require-verified-login: ${REQUIRE_VERIFIED_LOGIN:true}
  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@example.com}
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/api/v1}

logging:
  level:
    root: INFO
    com.example.ecommerce: DEBUG
