spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce?sslmode=disable}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DATABASE_USERNAME:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 540000
      keepalive-time: 30000
      validation-timeout: 5000
      pool-name: ecommerce-hikari-prod
  cache:
    type: ${CACHE_TYPE:simple}
    cache-names: products,product-details,categories,category-tree,brands,active-brands,search-autocomplete,search-trending,dashboard-summary
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 2
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  verification:
    require-verified-login: ${REQUIRE_VERIFIED_LOGIN:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
  redis:
    enabled: ${REDIS_ENABLED:false}
  storage:
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/api/v1}

logging:
  level:
    root: INFO
    com.example.ecommerce: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      # Mail is optional on Render (MAIL_ENABLED=false). Without SMTP credentials the
      # auto-configured JavaMailSender's health indicator fails every probe, flipping
      # /actuator/health to DOWN and triggering Render restarts. Disable it unless mail is on.
      enabled: ${MAIL_ENABLED:false}
