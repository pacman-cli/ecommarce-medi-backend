<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Status Update</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; background: #ffffff; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { background: #4f46e5; color: #ffffff; padding: 30px; text-align: center; }
        .content { padding: 30px; line-height: 1.6; }
        .status-badge { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 8px 16px; border-radius: 20px; font-weight: bold; margin: 10px 0; }
        .footer { background: #f8fafc; padding: 20px; text-align: center; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Order Status Update</h1>
    </div>
    <div class="content">
        <h2>Hello <span th:text="${customerName}">Customer</span>,</h2>
        <p>Your order <strong>#<span th:text="${orderNumber}">ORD-123456</span></strong> status has been updated:</p>
        <div class="status-badge" th:text="${orderStatus}">SHIPPED</div>
        <p th:text="${statusMessage}">Your package has been handed over to the courier partner and is on its way!</p>
        <p th:if="${trackingNumber}">Tracking Number: <strong th:text="${trackingNumber}">TRK-2026-9901</strong></p>
    </div>
    <div class="footer">
        <p>&copy; 2026 E-Commerce Store. Delivery Notifications.</p>
    </div>
</div>
</body>
</html>
